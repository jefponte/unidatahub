apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: unidatahub-stg

resources:
- ../../base
- namespace.yaml
- sealed-secret-mariadb-credentials.yaml
- sealed-secret-laravel-secrets.yaml
- sealed-secret-ext-db.yaml

patches:
- path: patch-deployment.yaml
  target:
    kind: Deployment
    name: unidatahub
- path: patch-ingress.yaml
  target:
    kind: Ingress
    name: unidatahub
- path: patch-hpa.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: unidatahub
- path: mariadb/patch-statefulset.yaml
  target:
    kind: StatefulSet
    name: mariadb
- path: mariadb/patch-service-loadbalancer.yaml
  target:
    kind: Service
    name: mariadb-lb

configMapGenerator:
- behavior: merge
  literals:
  - APP_NAME=UnidataHub
  - APP_ENV=staging
  - APP_DEBUG=false
  - APP_URL=https://unidatahub-staging.unilab.edu.br
  - MAIL_FROM_ADDRESS=noreply@unidatahub-staging.unilab.edu.br
  - MAIL_FROM_NAME=[Treinamento] UidataHub - UNILAB
  - LOG_LEVEL=info
  - MESSAGE=Staging
  name: unidatahub-config
  options:
    disableNameSuffixHash: true
- behavior: merge
  literals:
  - DB_HOST=mariadb-app.unidatahub-stg.svc.cluster.local
  - DB_DATABASE=unidatahub_stag
  - MYSQL_DATABASE=unidatahub_stag
  - MYSQL_USER=unidatahub_stag_user
  - MARIADB_CLUSTER_NAME=unidatahub_stag_galera_cluster
  - DB_SIGAA_DRIVER=pgsql
  - DB_SIGAA_DATABASE=sigaa
  - DB_SIGAA_HOST=10.180.1.10
  - DB_SIGAA_PORT=5432
  - DB_SIGAA_USERNAME=api_conn_sig
  - DB_SISTEMAS_COMUM_DATABASE=sistemas_comum
  - DB_SISTEMAS_COMUM_DRIVER=pgsql
  - DB_SISTEMAS_COMUM_HOST=10.180.1.11
  - DB_SISTEMAS_COMUM_PORT=5432
  - DB_SISTEMAS_COMUM_USERNAME=api_conn_sig
  name: mariadb-env
  options:
    disableNameSuffixHash: true

images:
- name: harbor.unilab.edu.br/unilab/unidatahub
  newTag: stg-b8c5a8e2

labels:
- pairs:
    environment: staging

commonAnnotations:
  description: Ambiente de homologação - UnidataHub
