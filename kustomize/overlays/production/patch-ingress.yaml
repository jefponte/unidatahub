apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unidatahub
spec:
  rules:
    - host: unidatahub.unilab.edu.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unidatahub
                port:
                  number: 80
