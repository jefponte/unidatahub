apiVersion: apps/v1
kind: Deployment
metadata:
  name: unidatahub-api
spec:
  template:
    metadata:
      labels:
        environment: production
    spec:
      containers:
        - name: unidatahub-api
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            initialDelaySeconds: 60
            timeoutSeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          readinessProbe:
            initialDelaySeconds: 20
            timeoutSeconds: 20
            periodSeconds: 5
            failureThreshold: 5