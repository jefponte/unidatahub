apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: unidatahub-api-prd

resources:
- ../../base
- namespace.yaml
- sealed-secret-mariadb-credentials.yaml
- sealed-secret-laravel-secrets.yaml
- sealed-secret-ext-db.yaml

patches:
- path: patch-deployment.yaml
  target:
    kind: Deployment
    name: unidatahub-api
- path: patch-ingress.yaml
  target:
    kind: Ingress
    name: unidatahub-api
- path: patch-hpa.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: unidatahub-api
- path: mariadb/patch-statefulset.yaml
  target:
    kind: StatefulSet
    name: mariadb
- path: mariadb/patch-service-loadbalancer.yaml
  target:
    kind: Service
    name: mariadb-lb
- target:
    kind: Deployment
    name: unidatahub-api
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: ext-db-secrets

configMapGenerator:
- behavior: merge
  literals:
  - APP_NAME=unidatahub
  - APP_ENV=production
  - APP_DEBUG=false
  - APP_URL=https://unidatahub.unilab.edu.br
  - MAIL_FROM_ADDRESS=noreply@unidatahub.unilab.edu.br
  - MAIL_FROM_NAME=UnidataHub
  - LOG_LEVEL=error
  - MESSAGE=Production
  - SIGAA_DB_CONNECTION=pgsql
  - DB_USERNAME=unidatahub_prod_user
  - SIGAA_DB_HOST=10.180.1.10
  - SIGAA_DB_PORT=5432
  - SIGAA_DB_DATABASE=sigaa
  - SIGAA_DB_USERNAME=api_conn_sig
  - SISTEMAS_COMUM_DB_CONNECTION=pgsql
  - SISTEMAS_COMUM_DB_HOST=10.180.1.11
  - SISTEMAS_COMUM_DB_PORT=5432
  - SISTEMAS_COMUM_DB_DATABASE=sistemas_comum
  - SISTEMAS_COMUM_DB_USERNAME=api_conn_sig
  - SISTEMAS_COMUM_DB_CHARSET=UTF-8
  - SISTEMAS_COMUM_DB_COLLATION=pt_BR.UTF-8
  name: unidatahub-api-config
  options:
    disableNameSuffixHash: true
- behavior: merge
  literals:
  - DB_HOST=mariadb-app.unidatahub-api-prd.svc.cluster.local
  - DB_DATABASE=unidatahub_prod
  - MYSQL_DATABASE=unidatahub_prod
  - MYSQL_USER=unidatahub_prod_user
  - MARIADB_CLUSTER_NAME=unidatahub_prod_galera_cluster
  name: mariadb-env
  options:
    disableNameSuffixHash: true

images:
- name: harbor.unilab.edu.br/unilab/unidatahub-api
  newTag: v7.0.1

labels:
- pairs:
    environment: production

commonAnnotations:
  description: Ambiente de produção - unidatahub Api
