apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unidatahub-api
spec:
  rules:
    - host: unidatahub-api-development.unilab.edu.br  # Host de development
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unidatahub-api
                port:
                  number: 80
