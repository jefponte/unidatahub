apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: unidatahub-api-dev

resources:
- ../../base
- namespace.yaml
- sealed-secret-mariadb-credentials.yaml
- sealed-secret-laravel-secrets.yaml
- sealed-secret-ext-db.yaml

patches:
- path: patch-deployment.yaml
  target:
    kind: Deployment
    name: unidatahub-api
- path: patch-ingress.yaml
  target:
    kind: Ingress
    name: unidatahub-api
- path: patch-hpa.yaml
  target:
    kind: HorizontalPodAutoscaler
    name: unidatahub-api
- path: mariadb/patch-statefulset.yaml
  target:
    kind: StatefulSet
    name: mariadb
- path: mariadb/patch-service-loadbalancer.yaml
  target:
    kind: Service
    name: mariadb-lb
- target:
    kind: Deployment
    name: unidatahub-api
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: ext-db-secrets

configMapGenerator:
- behavior: merge
  literals:
  - APP_NAME=Unidatahub - Development
  - APP_ENV=development
  - APP_DEBUG=true
  - APP_URL=https://unidatahub-development.unilab.edu.br
  - MAIL_FROM_ADDRESS=noreply@unidatahub-development.unilab.edu.br
  - MAIL_FROM_NAME=[Development] Unidatahub - UNILAB
  - LOG_LEVEL=debug
  - MESSAGE=Development
  - SIGAA_DB_CONNECTION=pgsql
  - SIGAA_DB_HOST=10.180.6.11
  - SIGAA_DB_PORT=5432
  - SIGAA_DB_DATABASE=sigaa
  - SIGAA_DB_USERNAME=sigaa
  - SISTEMAS_COMUM_DB_CONNECTION=pgsql
  - SISTEMAS_COMUM_DB_HOST=10.180.6.11
  - SISTEMAS_COMUM_DB_PORT=5432
  - SISTEMAS_COMUM_DB_DATABASE=sistemas_comum
  - SISTEMAS_COMUM_DB_USERNAME=sistemas_comum
  - SISTEMAS_COMUM_DB_CHARSET=UTF-8
  - SISTEMAS_COMUM_DB_COLLATION=pt_BR.UTF-8
  name: unidatahub-api-config
  options:
    disableNameSuffixHash: true
- behavior: merge
  literals:
  - DB_HOST=mariadb-app.unidatahub-api-dev.svc.cluster.local
  - DB_DATABASE=unidatahub_dev
  - MYSQL_DATABASE=unidatahub_dev
  - MYSQL_USER=unidatahub_dev_user
  - MARIADB_CLUSTER_NAME=unidatahub_dev_galera_cluster
  name: mariadb-env
  options:
    disableNameSuffixHash: true

secretGenerator:
- files:
  - PASSPORT_PRIVATE_KEY=passport-private.key
  - PASSPORT_PUBLIC_KEY=passport-public.key
  name: passport-keys
  options:
    disableNameSuffixHash: true

images:
- name: harbor.unilab.edu.br/unilab/unidatahub-api
  newTag: dev-0ba69434

labels:
- pairs:
    environment: development

commonAnnotations:
  description: Ambiente de desenvolvimento - unidatahub Api
