services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unidatahub
    restart: unless-stopped
    environment:
      - APP_ENV=local
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=unidatahub
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - SIGAA_DB_CONNECTION=pgsql
      - SIGAA_DB_HOST=sigaa-db
      - SIGAA_DB_PORT=5432
      - SIGAA_DB_DATABASE=sigaa
      - SIGAA_DB_USERNAME=sigaa
      - SIGAA_DB_PASSWORD=sigaa
      - SISTEMAS_COMUM_DB_CONNECTION=pgsql
      - SISTEMAS_COMUM_DB_HOST=sigaa-db
      - SISTEMAS_COMUM_DB_PORT=5432
      - SISTEMAS_COMUM_DB_DATABASE=sigaa
      - SISTEMAS_COMUM_DB_USERNAME=sigaa
      - SISTEMAS_COMUM_DB_PASSWORD=sigaa

    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
    ports:
      - "8083:80"
    networks:
      - unidatahub-network
    entrypoint: >
      bash -c "chown -R www-data:www-data storage bootstrap/cache
      && chmod -R 775 storage bootstrap/cache
      && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: unidatahub-db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: unidatahub
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - unidatahub-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: unidatahub-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    networks:
      - unidatahub-network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: unidatahub-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@unidatahub.unilab.edu.br}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8084:80"
    depends_on:
      - db
    volumes:
      - pgadmin-dev:/var/lib/pgadmin
    networks:
      - unidatahub-network


  sigaa-db:
    image: postgres:15
    container_name: unidatahub-sigaa-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: sigaa
      POSTGRES_USER: sigaa
      POSTGRES_PASSWORD: sigaa
    volumes:
      - sigaa-dbdata:/var/lib/postgresql/data
    networks:
      - unidatahub-network

networks:
  unidatahub-network:

volumes:
  dbdata:
  sigaa-dbdata:
  pgadmin-dev:
  vendor:
  storage:
